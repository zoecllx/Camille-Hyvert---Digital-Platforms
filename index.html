<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Hub · Digital Platforms Test Drive</title>
  <meta name="description" content="Interactive games to revise each session of Digital Platforms Test Drive, MSc Marketing Management & Digital, ESSEC Business School.">

  <!-- Fonts: Fraunces (soft, peachy serif for headings) + DM Sans (clean body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       1. DESIGN TOKENS (CSS variables)
       Change a colour here and it changes everywhere on the site.
       Palette inspired by the "Peach Fuzz" moodboard: peach, blush, sunset
       pinks, a hot-pink accent, and deep berry for readable text.
       ===================================================================== */
    :root {
      /* Backgrounds */
      --cream:        #FFF8F3;
      --peach-50:     #FFF1EA;
      --peach-100:    #FFE4D6;
      --peach-fuzz:   #FFBE98;   /* Pantone 13-1023 Peach Fuzz */
      --blush:        #F9CFD3;
      --pink-200:     #FBD3DC;
      --pink-300:     #F7A6BB;

      /* Accents */
      --hot-pink:      #EC4C82;  /* decorative accent (borders, hearts, glows) */
      --hot-pink-deep: #C81E5B;  /* buttons with white text (passes contrast) */
      --coral:         #FF8A7A;

      /* Text */
      --berry-900: #3B0D28;      /* main text */
      --berry-700: #6E1F4A;      /* secondary text */
      --berry-500: #95486F;      /* muted text */

      /* Feedback (always paired with an icon, never colour alone) */
      --ok:     #17775A;
      --ok-bg:  #E2F5EC;
      --bad:    #B4233F;
      --bad-bg: #FDE3E8;

      /* Shape & depth */
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius:    16px;
      --radius-sm: 12px;
      --shadow-soft: 0 12px 32px -14px rgba(110, 31, 74, 0.35);
      --shadow-pop:  0 18px 40px -12px rgba(200, 30, 91, 0.45);

      /* Type */
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body:    "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

      /* Motion */
      --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* =====================================================================
       2. BASE STYLES
       ===================================================================== */
    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.55;
      color: var(--berry-900);
      background-color: var(--cream);
      /* Soft "sunset through curtains" glow, like the moodboard */
      background-image:
        radial-gradient(60rem 30rem at 110% -10%, rgba(255, 190, 152, 0.55), transparent 60%),
        radial-gradient(50rem 30rem at -10% 20%, rgba(247, 166, 187, 0.35), transparent 60%),
        radial-gradient(40rem 30rem at 50% 110%, rgba(255, 228, 214, 0.9), transparent 60%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3 {
      font-family: var(--font-display);
      line-height: 1.15;
      margin: 0;
      letter-spacing: -0.01em;
    }

    button { font: inherit; color: inherit; }

    /* Visible focus for keyboard users: a thick hot-pink ring.
       :focus-visible only shows it for keyboard navigation, not mouse clicks. */
    :focus-visible {
      outline: 3px solid var(--hot-pink-deep);
      outline-offset: 3px;
      border-radius: 10px;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .skip-link {
      position: absolute; left: 16px; top: -60px;
      background: var(--berry-900); color: #fff;
      padding: 10px 16px; border-radius: 999px;
      z-index: 100; text-decoration: none; font-weight: 700;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 12px; }

    .wrap {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* =====================================================================
       3. HEADER
       ===================================================================== */
    .site-header { padding: 28px 0 0; }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--berry-500);
    }

    .site-title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
    }
    .site-title em {
      font-style: italic;
      font-weight: 600;
      color: var(--hot-pink-deep);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--berry-700);
      font-weight: 500;
    }

    /* Sound on/off toggle */
    .sound-toggle {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 8px;
      border: 2px solid var(--pink-300);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s var(--ease-bounce);
    }
    .sound-toggle:hover { background: var(--pink-200); transform: translateY(-2px); }
    .sound-toggle[aria-pressed="false"] { opacity: 0.7; }

    /* =====================================================================
       4. TABS
       ===================================================================== */
    .tabs {
      position: relative;   /* so tab.offsetLeft is measured from the strip */
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding: 6px 4px 14px;
      overflow-x: auto;              /* swipe sideways on a phone */
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
    }

    .tab {
      scroll-snap-align: start;
      flex-shrink: 0;
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 2px;
      min-width: 150px;
      padding: 10px 18px 12px;
      border: 2px solid var(--pink-200);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      text-align: left;
      transition: background 0.25s, border-color 0.25s, transform 0.25s var(--ease-bounce), box-shadow 0.25s;
    }
    .tab:hover { transform: translateY(-3px); border-color: var(--pink-300); box-shadow: var(--shadow-soft); }

    .tab-num {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--berry-500);
    }
    .tab-title { font-weight: 700; font-size: 0.95rem; }

    /* The selected tab (aria-selected is set by JavaScript) */
    .tab[aria-selected="true"] {
      background: linear-gradient(135deg, var(--hot-pink-deep), var(--hot-pink));
      border-color: transparent;
      color: #fff;
      box-shadow: var(--shadow-pop);
    }
    .tab[aria-selected="true"] .tab-num { color: rgba(255, 255, 255, 0.85); }

    .tab.is-soon .tab-title { color: var(--berry-500); }
    .tab.is-soon .tab-title::after { content: " ⏳"; }

    /* =====================================================================
       5. PANELS (one per tab) + smooth tab transition
       ===================================================================== */
    main { flex: 1; padding: 8px 0 40px; }

    .panel[hidden] { display: none; }
    .panel.is-entering { animation: panel-in 0.45s var(--ease-out); }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to   { opacity: 1; transform: none; }
    }

    .session-head {
      background: linear-gradient(135deg, var(--peach-fuzz), var(--pink-300));
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 26px 28px 30px;
      position: relative;
      overflow: hidden;
    }
    /* decorative sun glow in the corner */
    .session-head::after {
      content: "";
      position: absolute; right: -60px; top: -60px;
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 246, 224, 0.9), rgba(255, 246, 224, 0) 70%);
      pointer-events: none;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      background: rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .session-title { font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 800; max-width: 22ch; }
    .session-summary { margin: 10px 0 0; max-width: 60ch; color: var(--berry-700); font-weight: 500; }

    .game-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 28px;
      min-height: 360px;
    }

    /* =====================================================================
       6. BUTTONS (shared)
       ===================================================================== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: none;
      border-radius: 999px;
      padding: 13px 26px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.25s var(--ease-bounce), box-shadow 0.25s, background 0.25s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--hot-pink-deep), #DB2F6C);
      color: #fff;
      box-shadow: 0 8px 18px -8px rgba(200, 30, 91, 0.7);
    }
    .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: var(--shadow-pop); }
    .btn-primary:active { transform: translateY(0) scale(0.98); }
    .btn-ghost {
      background: transparent;
      border: 2px solid var(--pink-300);
      color: var(--berry-900);
    }
    .btn-ghost:hover { background: var(--pink-200); transform: translateY(-2px); }

    /* =====================================================================
       7. GAME SCREENS
       ===================================================================== */
    .stage > * { animation: panel-in 0.4s var(--ease-out); }

    .stage-heading { font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 800; }
    .stage-heading:focus { outline: none; }
    .stage-heading:focus-visible { outline: 3px solid var(--hot-pink-deep); }

    /* --- Intro & round intro --- */
    .round-list {
      list-style: none; padding: 0; margin: 20px 0 26px;
      display: grid; gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }
    .round-list li {
      background: var(--peach-50);
      border: 2px solid var(--peach-100);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .round-list .r-emoji { font-size: 1.5rem; display: block; }
    .round-list .r-name { font-weight: 700; display: block; }
    .round-list .r-meta { font-size: 0.85rem; color: var(--berry-500); }

    .round-intro { text-align: center; padding: 20px 0; }
    .round-intro .big-emoji {
      font-size: 4rem; display: inline-block;
      animation: wobble 2.4s ease-in-out infinite;
    }
    .round-intro p { max-width: 52ch; margin: 12px auto 24px; color: var(--berry-700); }

    @keyframes wobble {
      0%, 100% { transform: rotate(-6deg) scale(1); }
      50%      { transform: rotate(6deg) scale(1.08); }
    }

    /* --- HUD: round, progress bar, score --- */
    .hud {
      display: flex; align-items: center; gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .hud-round { font-weight: 700; font-size: 0.9rem; color: var(--berry-700); }
    .progress {
      flex: 1; min-width: 120px;
      height: 10px;
      background: var(--peach-100);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress > span {
      display: block; height: 100%;
      background: linear-gradient(90deg, var(--peach-fuzz), var(--hot-pink));
      border-radius: inherit;
      transition: width 0.5s var(--ease-out);
    }
    .score-pill {
      background: var(--berry-900); color: #fff;
      border-radius: 999px; padding: 6px 14px;
      font-weight: 700; font-size: 0.9rem;
      white-space: nowrap;
    }
    .score-pill.bump { animation: bump 0.5s var(--ease-bounce); }
    @keyframes bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); background: var(--hot-pink-deep); }
      100% { transform: scale(1); }
    }

    /* --- Question --- */
    .q-kicker { margin: 0 0 6px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--berry-500); }
    .q-prompt { font-size: clamp(1.15rem, 2.6vw, 1.45rem); font-weight: 600; max-width: 46ch; }
    .q-prompt:focus { outline: none; }

    .choices {
      display: grid;
      gap: 10px;
      margin-top: 20px;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }
    .choice {
      position: relative;
      text-align: left;
      background: #fff;
      border: 2px solid var(--pink-200);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s var(--ease-bounce), background 0.2s, border-color 0.2s, box-shadow 0.2s, opacity 0.3s;
    }
    .choice:hover:not(:disabled) {
      transform: translateY(-3px);
      background: var(--peach-50);
      border-color: var(--hot-pink);
      box-shadow: var(--shadow-soft);
    }
    .choice:active:not(:disabled) { transform: scale(0.97); }
    .choice:disabled { cursor: default; opacity: 0.45; }

    /* After answering, correct/wrong keep full opacity + an icon */
    .choice.is-correct, .choice.is-wrong { opacity: 1; }
    .choice.is-correct { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
    .choice.is-wrong   { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); animation: shake 0.4s; }
    .choice.is-correct::after, .choice.is-wrong::after {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-weight: 800;
    }
    .choice.is-correct::after { content: "✓"; }
    .choice.is-wrong::after   { content: "✗"; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Higher / Lower */
    .guess-card {
      margin-top: 18px;
      display: inline-flex; flex-direction: column; gap: 2px;
      background: linear-gradient(135deg, var(--peach-100), var(--pink-200));
      border-radius: var(--radius-lg);
      padding: 16px 24px;
    }
    .guess-card span { font-size: 0.85rem; font-weight: 700; color: var(--berry-700); }
    .guess-card strong { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; }
    .choices-higherlower { grid-template-columns: 1fr 1fr; max-width: 460px; }
    .choices-higherlower .choice { text-align: center; font-size: 1.1rem; padding: 16px; }

    /* Sort board: two buckets that fill up as you play */
    .sort-board {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-top: 20px;
    }
    .bucket {
      background: var(--peach-50);
      border: 2px dashed var(--pink-300);
      border-radius: var(--radius-lg);
      padding: 10px;
      min-height: 140px;
    }
    .bucket .choice { width: 100%; text-align: center; font-size: 1.05rem; padding: 14px; }
    .bucket ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
    .bucket li {
      background: #fff;
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 0.82rem;
      box-shadow: 0 2px 6px -3px rgba(110, 31, 74, 0.3);
    }
    .bucket li.chip-in { animation: chip-in 0.5s var(--ease-bounce); }
    @keyframes chip-in {
      from { opacity: 0; transform: translateY(-20px) scale(0.8); }
      to   { opacity: 1; transform: none; }
    }

    /* Text answer (bonus) */
    .text-answer { margin-top: 20px; max-width: 520px; }
    .text-answer label { font-weight: 700; display: block; margin-bottom: 6px; }
    .text-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .text-row input {
      flex: 1; min-width: 200px;
      font: inherit;
      padding: 12px 16px;
      border: 2px solid var(--pink-300);
      border-radius: 999px;
      background: #fff;
      color: var(--berry-900);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .text-row input:focus { outline: none; border-color: var(--hot-pink-deep); box-shadow: 0 0 0 4px var(--pink-200); }
    .hint { font-size: 0.85rem; color: var(--berry-500); margin: 8px 0 0; }

    /* Feedback box */
    .feedback { margin-top: 18px; }
    .feedback:empty { display: none; }
    .feedback-box {
      border-radius: var(--radius);
      padding: 14px 18px;
      animation: panel-in 0.35s var(--ease-out);
    }
    .feedback-box.ok  { background: var(--ok-bg);  border-left: 6px solid var(--ok); }
    .feedback-box.bad { background: var(--bad-bg); border-left: 6px solid var(--bad); }
    .feedback-box .fb-title { margin: 0 0 4px; font-weight: 800; }
    .feedback-box.ok  .fb-title { color: var(--ok); }
    .feedback-box.bad .fb-title { color: var(--bad); }
    .feedback-box p { margin: 0; }

    .q-actions { margin-top: 18px; display: flex; justify-content: flex-end; }
    .q-actions [hidden] { display: none; }

    /* --- Final screen --- */
    .final { text-align: center; padding: 10px 0; }
    .badge {
      width: 150px; height: 150px; margin: 10px auto 14px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: conic-gradient(from 0deg, var(--peach-fuzz), var(--hot-pink), var(--pink-300), var(--peach-fuzz));
      animation: spin-in 0.9s var(--ease-bounce);
      position: relative;
    }
    .badge::before {
      content: ""; position: absolute; inset: 10px; border-radius: 50%;
      background: var(--cream);
    }
    .badge span { position: relative; font-size: 3.6rem; }
    @keyframes spin-in {
      from { transform: scale(0) rotate(-180deg); }
      to   { transform: scale(1) rotate(0); }
    }
    .badge-name { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; color: var(--hot-pink-deep); }
    .final-score { font-size: 1.15rem; font-weight: 700; margin: 8px 0; }
    .final-score .count { font-family: var(--font-display); font-size: 2.4rem; }
    .final-blurb { max-width: 52ch; margin: 0 auto; color: var(--berry-700); }

    .breakdown {
      list-style: none; padding: 0;
      margin: 22px auto; max-width: 520px;
      display: grid; gap: 6px; text-align: left;
    }
    .breakdown li {
      display: flex; justify-content: space-between; gap: 10px;
      background: var(--peach-50); border-radius: var(--radius-sm);
      padding: 8px 14px; font-size: 0.92rem;
    }

    .takeaway {
      margin: 22px auto; max-width: 600px;
      background: linear-gradient(135deg, var(--peach-100), var(--pink-200));
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.15rem;
    }
    .takeaway .eyebrow { font-family: var(--font-body); font-style: normal; }

    /* =====================================================================
       8. COMING SOON PLACEHOLDER
       ===================================================================== */
    .soon { text-align: center; padding: 40px 10px; }
    .soon-fruit { font-size: 2.6rem; display: flex; justify-content: center; gap: 18px; }
    .soon-fruit span { display: inline-block; animation: float 2.2s ease-in-out infinite; }
    .soon-fruit span:nth-child(2) { animation-delay: 0.25s; }
    .soon-fruit span:nth-child(3) { animation-delay: 0.5s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-16px) rotate(4deg); }
    }
    .soon h2 {
      margin-top: 18px;
      font-size: clamp(1.4rem, 4vw, 2rem);
      background: linear-gradient(90deg, var(--hot-pink-deep), var(--coral), var(--hot-pink-deep));
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    .soon p { color: var(--berry-700); }
    .dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
    .dots span {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--hot-pink);
      animation: dot 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; background: var(--coral); }
    .dots span:nth-child(3) { animation-delay: 0.3s;  background: var(--peach-fuzz); }
    @keyframes dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40%           { transform: scale(1);   opacity: 1; }
    }

    /* =====================================================================
       9. "PHOTO POP" + FLYING HEARTS
       ===================================================================== */
    .photo-pop {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      pointer-events: none;           /* never blocks clicks */
      z-index: 50;
    }
    .polaroid {
      margin: 0;
      background: #fff;
      padding: 12px 12px 14px;
      border-radius: 6px;
      box-shadow: 0 30px 60px -20px rgba(59, 13, 40, 0.55);
      width: min(240px, 60vw);
      transform: scale(0);
      opacity: 0;
    }
    .polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; }
    .polaroid figcaption {
      font-family: var(--font-display); font-style: italic; font-weight: 600;
      text-align: center; margin-top: 8px; font-size: 1.15rem;
    }
    .photo-pop.show .polaroid { animation: photo-pop 1.7s var(--ease-out) forwards; }
    @keyframes photo-pop {
      0%   { transform: scale(0.2) rotate(-18deg); opacity: 0; }
      18%  { transform: scale(1.12) rotate(5deg);  opacity: 1; }
      28%  { transform: scale(1) rotate(-3deg);    opacity: 1; }

  // Make text safe before putting it inside innerHTML
  function escapeHTML(text) {
    return String(text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // Fisher–Yates shuffle: returns a NEW shuffled array (the original is untouched),
  // so "Play again" gives a different order every time.
  function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Lowercase + remove punctuation/extra spaces, so "A.I. Visibility!" ≈ "ai visibility"
  function normalise(text) {
    return text.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
  }

        if (!AudioCtx) return null;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
      return this.ctx;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.015);     // quick fade in
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);  // smooth fade out
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    },

    click()   { this.note(660, 0, 0.06, "triangle", 0.06); },
    correct() { this.note(784, 0, 0.14); this.note(1175, 0.09, 0.3); },              // "ding-ding!"
    wrong()   { this.note(330, 0, 0.2, "triangle", 0.14, 220); this.note(220, 0.15, 0.3, "triangle", 0.12, 160); }, // "bwoo-op"
    pop()     { this.note(280, 0, 0.14, "sine", 0.28, 1400); this.note(1600, 0.1, 0.12, "sine", 0.08); },          // bubble pop
    win()     { [523, 659, 784, 1047].forEach((f, i) => this.note(f, i * 0.12, 0.35, "triangle", 0.15));
                this.note(1319, 0.5, 0.7, "sine", 0.12); }                                                           // little fanfare
  };


  /* ---------- B3. "Photo pop" + flying hearts ---------- */

  // Built-in drawings (SVG), used when popPhotos contains "peach", "sunset" or "hearts"
  const ILLUSTRATIONS = {

  // Turn "peach" into an SVG data URL, or keep a real file name as is
  function photoSource(nameOrFile) {
    const svg = ILLUSTRATIONS[nameOrFile];
    return svg ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg) : nameOrFile;
  }

  let popTimer = null;
  function popPhoto(caption) {
    const overlay = $("#photo-pop");
    const pick = SITE.popPhotos[Math.floor(Math.random() * SITE.popPhotos.length)];
    overlay.innerHTML = `
      <figure class="polaroid">
        <img src="${escapeHTML(photoSource(pick))}" alt="">
        <figcaption>${escapeHTML(caption)}</figcaption>
      </figure>`;
    // Restart the CSS animation: remove the class, force a reflow, add it back
    overlay.classList.remove("show");

    overlay.classList.add("show");

    clearTimeout(popTimer);
    popTimer = setTimeout(() => overlay.classList.remove("show"), 1800);

  // Little hearts that fly out of an element (e.g. the button you just clicked)
  function burstHearts(fromElement, count = 10) {
    if (reduceMotion || !fromElement) return;
    const box = fromElement.getBoundingClientRect();
    const shapes = ["♥", "✿", "♥", "✦"];
    for (let i = 0; i < count; i++) {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = shapes[i % shapes.length];
      heart.style.left = box.left + box.width / 2 + "px";
      heart.style.top = box.top + box.height / 2 + "px";
      // CSS reads these custom properties in the heart-fly animation
      heart.style.setProperty("--dx", (Math.random() * 180 - 90).toFixed(0) + "px");
      heart.style.setProperty("--dy", (-40 - Math.random() * 100).toFixed(0) + "px");
      heart.style.setProperty("--rot", (Math.random() * 120 - 60).toFixed(0) + "deg");
      document.body.appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }
  }

  // Animate a number from 0 up to its target
  function countUp(element, target) {
    if (reduceMotion) { element.textContent = target; return; }
    const start = performance.now();
    const duration = 900;
    function tick(now) {
      const progress = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);     // ease-out
      element.textContent = Math.round(target * eased);
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }


  /* ---------- B4. TABS ----------
     How tab switching works:
     1. buildTabs() creates one <button role="tab"> and one <section role="tabpanel">
        per session in SESSIONS.
     2. Clicking a tab (or using ← → Home End) calls selectTab(id).
     3. selectTab sets aria-selected="true" on the chosen tab (CSS styles it pink),
        and toggles the "hidden" attribute so only the matching panel is visible.
     4. The URL hash (#s2) is updated so you can share a link to a specific tab.     */

  const tablist = $("#tablist");
  const panelsRoot = $("#panels");

  function buildTabs() {
    SESSIONS.forEach((session, index) => {
      // --- the tab button ---
      const tab = document.createElement("button");
      tab.type = "button";
      tab.id = `tab-${session.id}`;
      tab.className = "tab" + (session.comingSoon ? " is-soon" : "");
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-controls", `panel-${session.id}`);
      tab.setAttribute("aria-selected", "false");
      tab.tabIndex = -1;  // only the selected tab is in the Tab order ("roving tabindex")
      tab.innerHTML = `
        <span class="tab-num">${escapeHTML(session.tabLabel)}</span>
        <span class="tab-title">${escapeHTML(session.shortTitle)}</span>`;

      // EVENT LISTENER: when this button is clicked, run selectTab for this session
      tab.addEventListener("click", () => {
        Sound.click();
        selectTab(session.id);
      });
      tablist.appendChild(tab);

      // --- the panel ---
      const panel = document.createElement("section");
      panel.id = `panel-${session.id}`;
      panel.className = "panel";
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", tab.id);
      panel.hidden = true;
      panelsRoot.appendChild(panel);

      if (session.comingSoon) {
        renderComingSoon(session, panel);
      } else {
        renderSessionShell(session, panel);
        games[session.id] = newGameState(session);
        render(session);
      }
    });

    // One keyboard listener for the whole tab list (event delegation)
    tablist.addEventListener("keydown", onTabKeydown);
  }

  function selectTab(id, { focusTab = false } = {}) {
    SESSIONS.forEach(session => {
      const tab = $(`#tab-${session.id}`);
      const panel = $(`#panel-${session.id}`);
      const isActive = session.id === id;

      tab.setAttribute("aria-selected", String(isActive));
      tab.tabIndex = isActive ? 0 : -1;
      panel.hidden = !isActive;

      if (isActive) {
        // replay the fade/slide-in animation
        panel.classList.remove("is-entering");
        void panel.offsetWidth;
        panel.classList.add("is-entering");
        // Scroll the tab strip sideways (on phones) so the active tab is visible,
        // without scrolling the whole page
        tablist.scrollTo({ left: tab.offsetLeft - 16, behavior: reduceMotion ? "auto" : "smooth" });
        if (focusTab) tab.focus();
      }
    });
    history.replaceState(null, "", "#" + id);
  }

  // Arrow keys move between tabs, Home/End jump to first/last (WAI-ARIA tabs pattern)
  function onTabKeydown(event) {
    const tabs = [...tablist.querySelectorAll('[role="tab"]')];
    const current = tabs.indexOf(document.activeElement);
    if (current === -1) return;

    let next = null;
    if (event.key === "ArrowRight") next = (current + 1) % tabs.length;
    if (event.key === "ArrowLeft")  next = (current - 1 + tabs.length) % tabs.length;
    if (event.key === "Home")       next = 0;
    if (event.key === "End")        next = tabs.length - 1;
    if (next === null) return;

    event.preventDefault();
    selectTab(SESSIONS[next].id, { focusTab: true });
  }

  function renderComingSoon(session, panel) {
    panel.innerHTML = `
      <div class="game-card" style="border-radius: var(--radius-xl)">
        <div class="soon">
          <div class="soon-fruit" aria-hidden="true"><span>🍑</span><span>💗</span><span>🍑</span></div>
          <h2>Coming soon – guest speaker session</h2>
          <p>${escapeHTML(session.tabLabel)}'s game unlocks after class. Stay peachy!</p>
          <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </div>`;
  }

  // The coloured session header + an empty "stage" where the game screens appear
  function renderSessionShell(session, panel) {
    panel.innerHTML = `
      <div class="session-head">
        <div class="chips">
          <span class="chip">📅 ${escapeHTML(session.date)}</span>
          <span class="chip">🎤 ${escapeHTML(session.speaker)}</span>
        </div>
        <h2 class="session-title">${escapeHTML(session.title)}</h2>
        <p class="session-summary">${escapeHTML(session.summary)}</p>
      </div>
      <div class="game-card">
        <div class="stage"></div>
      </div>`;
  }


  /* ---------- B5. GAME STATE ----------
     Each session has its own state object, stored in games[session.id].
     Because state is kept per session, you can switch tabs mid-game and
     come back to exactly where you were.

     screen:        which screen to draw: "intro" | "roundIntro" | "question" | "final"
     roundIndex:    which round we're in (0 = first)
     questionIndex: which question inside the round
     questions:     the current round's questions, shuffled
     score:         points so far
     roundScores:   points per round (for the final breakdown)
     streak:        correct answers in a row (3 → photo pop!)
     answered:      true once the current question is answered (blocks double clicks)
     sorted:        for "sort" rounds: what's been dropped in each bucket so far      */
  const games = {};

  function newGameState(session) {
    return {
      screen: "intro",
      roundIndex: 0,
      questionIndex: 0,
      questions: [],
      score: 0,
      roundScores: session.rounds.map(() => 0),
      streak: 0,
      answered: false,
      sorted: [[], []]
    };
  }

  const pointsFor = round => round.points || 1;

  function maxScore(session) {
    return session.rounds.reduce((sum, round) => sum + round.items.length * pointsFor(round), 0);
  }

  /* Every round type is turned into the SAME question shape:
       { prompt, choices: [...], answer: <index of the correct choice>, explain, ... }
     That's why one engine can play all round types.                        */
  function buildQuestions(round) {
    return shuffle(round.items).map(item => {
      let choices = [];
      let answer;

      if (round.type === "match") {
        choices = round.options;
        answer = round.options.indexOf(item.answer);
      } else if (round.type === "higherlower") {
        choices = ["⬆ Higher", "⬇ Lower"];
        answer = item.answer === "higher" ? 0 : 1;
      } else if (round.type === "sort") {
        choices = round.buckets;
        answer = round.buckets.indexOf(item.answer);
      } else if (round.type === "text") {
        answer = item.answer;
      }

      // Helpful warning for typos in the data (open the browser console to see it)
      if (answer === -1) console.warn(`"${item.answer}" is not one of the options in round "${round.title}"`);

      return { ...item, choices, answer };
    });
  }


  /* ---------- B6. MOVING THROUGH THE GAME ---------- */

  function startGame(session) {
    games[session.id] = newGameState(session);
    games[session.id].screen = "roundIntro";
    render(session, { focus: true });
  }

  function startRound(session) {
    const state = games[session.id];
    const round = session.rounds[state.roundIndex];
    state.questions = buildQuestions(round);
    state.questionIndex = 0;
    state.sorted = [[], []];
    state.screen = "question";
    render(session, { focus: true });
  }

  function nextStep(session) {
    const state = games[session.id];
    state.questionIndex++;
    state.answered = false;

    if (state.questionIndex < state.questions.length) {
      state.screen = "question";                // more questions in this round
    } else if (state.roundIndex < session.rounds.length - 1) {
      state.roundIndex++;                       // next round
      state.screen = "roundIntro";
    } else {
      state.screen = "final";                   // game over!
    }
    render(session, { focus: true });
  }

  // Draw whichever screen the state says we're on
  function render(session, { focus = false } = {}) {
    const state = games[session.id];
    const stage = $(`#panel-${session.id} .stage`);

    if (state.screen === "intro")      renderIntro(session, stage);
    if (state.screen === "roundIntro") renderRoundIntro(session, stage);
    if (state.screen === "question")   renderQuestion(session, stage);
    if (state.screen === "final")      renderFinal(session, stage);

    // Move keyboard focus to the new heading so screen-reader users hear the new screen
    if (focus) {
      const heading = $("[data-focus]", stage);
      if (heading) heading.focus({ preventScroll: true });
      stage.closest(".game-card").scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    }
  }


  /* ---------- B7. SCREENS ---------- */

  function renderIntro(session, stage) {
    const roundsHTML = session.rounds.map((round, i) => `
      <li>
        <span class="r-emoji" aria-hidden="true">${round.emoji || "🎲"}</span>
        <span class="r-name">${i + 1}. ${escapeHTML(round.title)}</span>
        <span class="r-meta">${round.items.length} question${round.items.length > 1 ? "s" : ""} · ${pointsFor(round)} pt each</span>
      </li>`).join("");

    stage.innerHTML = `
      <h3 class="stage-heading" tabindex="-1" data-focus>Ready to play? 🍑</h3>
      <p>${session.rounds.length} rounds, <strong>${maxScore(session)} points</strong> to win. Instant feedback after every answer.</p>
      <ul class="round-list">${roundsHTML}</ul>
      <button class="btn btn-primary" type="button" data-action="start">Start the game ▶</button>`;

    // EVENT LISTENER: the start button
    $('[data-action="start"]', stage).addEventListener("click", () => {
      Sound.click();
      startGame(session);
    });
  }

  function renderRoundIntro(session, stage) {
    const state = games[session.id];
    const round = session.rounds[state.roundIndex];

    stage.innerHTML = `
      <div class="round-intro">
        <span class="big-emoji" aria-hidden="true">${round.emoji || "🎲"}</span>
        <p class="eyebrow">Round ${state.roundIndex + 1} of ${session.rounds.length}</p>
        <h3 class="stage-heading" tabindex="-1" data-focus>${escapeHTML(round.title)}</h3>
        <p>${escapeHTML(round.instructions)}</p>
        <button class="btn btn-primary" type="button" data-action="go">Let's go →</button>
        ${state.roundIndex > 0 ? `<p class="hint">Score so far: ${state.score} / ${maxScore(session)}</p>` : ""}
      </div>`;

    $('[data-action="go"]', stage).addEventListener("click", () => {
      Sound.click();
      startRound(session);
    });
  }

  function renderQuestion(session, stage) {
    const state = games[session.id];
    const round = session.rounds[state.roundIndex];
    const q = state.questions[state.questionIndex];
    const progress = (state.questionIndex / state.questions.length) * 100;

    // Build the answer area depending on the round type
    let answerArea = "";
    if (round.type === "sort") {
      answerArea = `
        <div class="sort-board">
          ${q.choices.map((bucket, i) => `
            <div class="bucket">
              <button class="choice" type="button" data-index="${i}">${escapeHTML(bucket)}</button>
              <ul aria-label="Sorted into ${escapeHTML(bucket)}">
                ${state.sorted[i].map(text => `<li>${escapeHTML(text)}</li>`).join("")}
              </ul>
            </div>`).join("")}
        </div>`;
    } else if (round.type === "text") {
      answerArea = `
        <form class="text-answer" novalidate>
          <label for="answer-${session.id}">Your answer</label>
          <div class="text-row">
            <input id="answer-${session.id}" type="text" autocomplete="off" spellcheck="false">
            <button class="btn btn-primary" type="submit">Check ✓</button>
          </div>
          ${q.hint ? `<p class="hint">💡 Hint: ${escapeHTML(q.hint)}</p>` : ""}
        </form>`;
    } else {
      answerArea = `
        ${round.type === "higherlower" ? `
          <div class="guess-card"><span>Our guess</span><strong>${escapeHTML(q.guess)}</strong><span>Is the real number higher or lower?</span></div>` : ""}
        <div class="choices choices-${round.type}" role="group" aria-label="Answer options">
          ${q.choices.map((choice, i) => `<button class="choice" type="button" data-index="${i}">${escapeHTML(choice)}</button>`).join("")}
        </div>`;
    }

    const isLastQuestion = state.questionIndex === state.questions.length - 1;
    const isLastRound = state.roundIndex === session.rounds.length - 1;
    const nextLabel = !isLastQuestion ? "Next question →" : isLastRound ? "See my results 🎉" : "Next round →";

    stage.innerHTML = `
      <div class="hud">
        <span class="hud-round">${round.emoji || ""} ${escapeHTML(round.title)}</span>
        <div class="progress" role="progressbar" aria-label="Round progress"
             aria-valuemin="0" aria-valuemax="${state.questions.length}" aria-valuenow="${state.questionIndex}">
          <span style="width:${progress}%"></span>
        </div>
        <span class="score-pill">⭐ <span class="score-num">${state.score}</span> / ${maxScore(session)}</span>
      </div>

      <p class="q-kicker">Question ${state.questionIndex + 1} of ${state.questions.length}</p>
      <h3 class="q-prompt" tabindex="-1" data-focus>${escapeHTML(q.prompt)}</h3>

      ${answerArea}

      <div class="feedback" aria-live="polite"></div>
      <div class="q-actions">
        <button class="btn btn-primary" type="button" data-action="next" hidden>${nextLabel}</button>
      </div>`;

    /* EVENT LISTENERS for the answers.
       Each choice button gets a "click" listener. When clicked, it tells
       checkAnswer which index was picked. The text form listens for "submit"
       (fires on button click AND on pressing Enter in the input).          */
    stage.querySelectorAll(".choice").forEach(button => {
      button.addEventListener("click", () => {
        const picked = Number(button.dataset.index);
        checkAnswer(session, picked === q.answer, button, picked);
      });
    });

    const form = $(".text-answer", stage);
    if (form) {
      form.addEventListener("submit", event => {
        event.preventDefault();                  // stop the page from reloading
        const input = $("input", form);
        if (!input.value.trim()) { input.focus(); return; }
        const guess = normalise(input.value);
        const isRight = q.accept.some(ok => guess === normalise(ok) || guess.includes(normalise(ok)));
        input.disabled = true;
        $("button", form).disabled = true;
        checkAnswer(session, isRight, $("button", form), null);
      });
    }

    $('[data-action="next"]', stage).addEventListener("click", () => {
      Sound.click();
      nextStep(session);
    });
  }

  /* checkAnswer: the heart of the game.
     1. Ignore extra clicks once answered.
     2. Update score + streak in the state object.
     3. Show colours, feedback text, sounds and animations.
     4. Reveal the Next button and move focus to it.                       */
  function checkAnswer(session, isRight, clickedButton, pickedIndex) {
    const state = games[session.id];
    if (state.answered) return;          // guard against double-clicks
    state.answered = true;

    const round = session.rounds[state.roundIndex];
    const q = state.questions[state.questionIndex];
    const stage = $(`#panel-${session.id} .stage`);
    const points = pointsFor(round);

    // --- 2. update state ---
    if (isRight) {
      state.score += points;
      state.roundScores[state.roundIndex] += points;
      state.streak++;
    } else {
      state.streak = 0;
    }

    // --- 3a. lock and colour the buttons ---
    const choiceButtons = [...stage.querySelectorAll(".choice")];
    choiceButtons.forEach((button, i) => {
      button.disabled = true;
      if (i === q.answer) button.classList.add("is-correct");
      if (i === pickedIndex && !isRight) button.classList.add("is-wrong");
    });

    // --- 3b. sort rounds: drop the statement into the correct bucket ---
    if (round.type === "sort") {
      state.sorted[q.answer].push(q.prompt);
      const list = stage.querySelectorAll(".bucket ul")[q.answer];
      const li = document.createElement("li");
      li.className = "chip-in";
      li.textContent = q.prompt;
      list.appendChild(li);
    }

    // --- 3c. feedback text ---
    const correctLabel = round.type === "text" ? q.answer : q.choices[q.answer];
    const revealLine = q.reveal ? `Real answer: <strong>${escapeHTML(q.reveal)}</strong>. ` : "";
    $(".feedback", stage).innerHTML = isRight
      ? `<div class="feedback-box ok">
           <p class="fb-title">✓ Correct! +${points}</p>
           <p>${revealLine}${escapeHTML(q.explain)}</p>
         </div>`
      : `<div class="feedback-box bad">
           <p class="fb-title">✗ Not quite. It's “${escapeHTML(correctLabel)}”.</p>
           <p>${revealLine}${escapeHTML(q.explain)}</p>
         </div>`;

    // --- 3d. score counter bump, sounds, hearts, photo pop ---
    const scorePill = $(".score-pill", stage);
    $(".score-num", stage).textContent = state.score;
    if (isRight) {
      scorePill.classList.add("bump");
      Sound.correct();
      burstHearts(clickedButton);
      if (state.streak > 0 && state.streak % SITE.streakForPop === 0) {
        setTimeout(() => popPhoto(`${state.streak} in a row! 🍑`), 350);
      }
    } else {
      Sound.wrong();
    }

    // --- 4. show "Next" and move focus to it (keyboard users can just press Enter) ---
    const nextButton = $('[data-action="next"]', stage);
    nextButton.hidden = false;
    nextButton.focus({ preventScroll: true });
    nextButton.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
  }

  function renderFinal(session, stage) {
    const state = games[session.id];
    const max = maxScore(session);
    const percent = Math.round((state.score / max) * 100);

    // Pick the highest badge whose "min" we reached
    const badge = [...session.badges].sort((a, b) => b.min - a.min).find(b => percent >= b.min);

    const breakdown = session.rounds.map((round, i) => `
      <li><span>${round.emoji || ""} ${escapeHTML(round.title)}</span>
          <strong>${state.roundScores[i]} / ${round.items.length * pointsFor(round)}</strong></li>`).join("");

    stage.innerHTML = `
      <div class="final">
        <p class="eyebrow">Session complete</p>
        <div class="badge" aria-hidden="true"><span>${badge.emoji}</span></div>
        <h3 class="badge-name" tabindex="-1" data-focus>${escapeHTML(badge.name)}</h3>
        <p class="final-score"><span class="count">0</span> / ${max} points · ${percent}%</p>
        <p class="final-blurb">${escapeHTML(badge.blurb)}</p>
        <ul class="breakdown">${breakdown}</ul>
        <blockquote class="takeaway">
          <p class="eyebrow">Key takeaway</p>
          ${escapeHTML(session.takeaway)}
        </blockquote>
        <button class="btn btn-primary" type="button" data-action="again">↻ Play again</button>
      </div>`;

    countUp($(".count", stage), state.score);
    Sound.win();
    setTimeout(() => {
      popPhoto(`${badge.name} ${badge.emoji}`);
      burstHearts($(".badge", stage), 18);
    }, 450);

    $('[data-action="again"]', stage).addEventListener("click", () => {
      Sound.click();
      startGame(session);   // fresh state + new shuffle
    });
  }


  /* ---------- B8. SOUND TOGGLE ---------- */
  function setupSoundToggle() {
    const button = $("#sound-toggle");
    const update = () => {
      button.setAttribute("aria-pressed", String(Sound.enabled));
      $(".label", button).textContent = Sound.enabled ? "Sound on" : "Sound off";
      $("span", button).textContent = Sound.enabled ? "🔊" : "🔇";
    };
    button.addEventListener("click", () => {
      Sound.enabled = !Sound.enabled;
      store.set("gamehub-sound", Sound.enabled ? "on" : "off");
      update();
      Sound.click();
    });
    update();
  }


  /* ---------- B9. START EVERYTHING ---------- */
  function init() {
    $("#built-by").textContent = SITE.builtBy;
    setupSoundToggle();
    buildTabs();

    // Open the tab from the URL (#s2), otherwise the first session
    const fromHash = location.hash.slice(1);
    const startId = SESSIONS.some(s => s.id === fromHash) ? fromHash : SESSIONS[0].id;
    selectTab(startId);
  }

  init();
  </script>
</body>
</html>
